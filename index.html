<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Leergut-Lager</title>
<style>
  :root{
    --bg:#EFEAE0;
    --surface:#FFFFFF;
    --surface-2:#F7F3EA;
    --ink:#211E19;
    --ink-soft:#6B6358;
    --line:#DCD3C0;
    --green:#1F6F54;
    --green-soft:#E2EFE8;
    --amber:#C2791E;
    --amber-soft:#F5E8D6;
    --magenta:#9C3B63;
    --magenta-soft:#F2E2E9;
    --danger:#A33636;
    --danger-soft:#F3E1DF;
    --radius:14px;
    --font-display: system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-body: system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'SF Mono', 'Consolas', 'Menlo', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;}
  body{min-height:100vh;}
  #app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);padding-bottom:84px;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;}
  a{color:inherit;}

  /* Header */
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line);}
  .topbar-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:0.01em;display:flex;align-items:center;gap:8px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;}
  .meta{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);}
  .gear{font-size:18px;padding:6px;line-height:1;color:var(--ink-soft);}
  .banner{margin-top:10px;font-size:12.5px;background:var(--amber-soft);color:#6B4416;border:1px solid #E6C892;border-radius:10px;padding:8px 10px;line-height:1.4;}
  .banner b{font-weight:600;}

  /* Tabs content area */
  .screen{padding:14px 16px 24px;flex:1;}
  .section-title{font-family:var(--font-display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);margin:18px 0 8px;}
  .section-title:first-child{margin-top:0;}

  /* Search box */
  .searchbox{position:relative;}
  .searchbox input{width:100%;padding:13px 14px;border-radius:12px 0 0 12px;border:1.5px solid var(--line);border-right:none;background:var(--surface);font-size:16px;color:var(--ink);}
  .searchbox input:focus{outline:2px solid var(--green);outline-offset:1px;}
  .searchbox .hint{font-size:12px;color:var(--ink-soft);margin-top:6px;padding-left:2px;}
  .searchbox-row{display:flex;align-items:stretch;}
  .search-btn{background:var(--green);color:#fff;border-radius:0 12px 12px 0;padding:0 18px;font-size:20px;flex-shrink:0;border:1.5px solid var(--green);}

  /* Article row (the "shelf label" signature element) */
  .article-row{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;}
  .tag-stripe{width:8px;flex:0 0 8px;background-image:repeating-linear-gradient(to bottom, var(--stripe-color) 0 6px, transparent 6px 11px);}
  .article-row.toner .tag-stripe{--stripe-color:var(--ink);}
  .article-row.tinte .tag-stripe{--stripe-color:var(--magenta);}
  .article-row.fuser .tag-stripe{--stripe-color:var(--amber);}
  .article-row.wt .tag-stripe{--stripe-color:var(--green);}
  .article-row-body{flex:1;padding:11px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;}
  .article-id{font-family:var(--font-mono);font-weight:600;font-size:14.5px;}
  .article-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .article-qty{font-family:var(--font-mono);font-weight:600;font-size:15px;background:var(--surface-2);border-radius:8px;padding:5px 10px;white-space:nowrap;}
  .article-row button.row-btn{background:var(--green-soft);color:var(--green);border-radius:8px;padding:8px 12px;font-weight:600;font-size:13.5px;white-space:nowrap;}
  .article-row.is-empty .article-qty{color:var(--ink-soft);background:transparent;}

  .empty-state{text-align:center;padding:34px 16px;color:var(--ink-soft);}
  .empty-state .big{font-family:var(--font-display);font-size:18px;color:var(--ink);margin-bottom:4px;}

  /* alias suggestion card */
  .alias-card{background:var(--magenta-soft);border:1px solid #DDB7C6;border-radius:12px;padding:12px;margin-bottom:12px;}
  .alias-card .label{font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--magenta);font-weight:600;margin-bottom:4px;}
  .alias-card .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;}
  .alias-card .id{font-family:var(--font-mono);font-weight:600;}
  .alias-card button{background:var(--magenta);color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;}
  .alias-card .remember{font-size:12px;color:var(--ink-soft);margin-top:6px;display:flex;align-items:center;gap:6px;}

  /* booking panel */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .panel-title{font-family:var(--font-mono);font-weight:600;font-size:15px;margin-bottom:2px;}
  .panel-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .field select,.field input[type=text],.field input[type=number]{width:100%;padding:10px 11px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface-2);font-size:15px;}
  .stepper{display:flex;align-items:center;gap:10px;}
  .stepper button{width:42px;height:42px;border-radius:9px;background:var(--surface-2);border:1.5px solid var(--line);font-size:20px;font-weight:600;}
  .stepper input{width:64px;text-align:center;padding:10px 6px;border-radius:9px;border:1.5px solid var(--line);font-family:var(--font-mono);font-size:16px;font-weight:600;}
  .panel-actions{display:flex;gap:8px;margin-top:6px;}
  .btn-primary{background:var(--green);color:#fff;border-radius:9px;padding:11px 16px;font-weight:600;font-size:14.5px;flex:1;text-align:center;}
  .btn-ghost{background:var(--surface-2);color:var(--ink-soft);border-radius:9px;padding:11px 16px;font-weight:600;font-size:14.5px;}

  /* location chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;font-family:var(--font-mono);}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .chip .count{color:var(--ink-soft);margin-left:5px;font-size:12px;}
  .chip.active .count{color:#D8D3C8;}
  .chip.palette{border-style:dashed;border-color:var(--amber);color:var(--amber);}
  .chip.palette.active{background:var(--amber);border-color:var(--amber);color:#fff;}
  .chip.palette.active .count{color:#F5E2C8;}

  /* pallets within booking panel */
  .pallet-item{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .pallet-item:last-child{border-bottom:none;}
  .pallet-unassigned{font-size:13px;color:var(--ink-soft);padding:8px 0 2px;}
  .pallet-form{background:var(--surface-2);border-radius:10px;padding:10px;margin-top:8px;}

  /* inventur list row inputs */
  .count-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;}
  .count-row .info{flex:1;min-width:0;}
  .count-row .id{font-family:var(--font-mono);font-weight:600;font-size:14px;}
  .count-row .sub{font-size:12px;color:var(--ink-soft);}
  .count-row input{width:64px;padding:8px 6px;text-align:center;border-radius:8px;border:1.5px solid var(--line);font-family:var(--font-mono);font-weight:600;font-size:15px;}
  .count-row.changed input{border-color:var(--amber);background:var(--amber-soft);}
  .sticky-cta{position:sticky;bottom:84px;background:var(--green);color:#fff;border-radius:12px;padding:13px;text-align:center;font-weight:600;margin-top:12px;box-shadow:0 6px 16px rgba(31,111,84,0.25);}

  .filters-row{display:flex;gap:8px;margin-bottom:10px;}
  .filters-row select{flex:1;padding:9px 8px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-size:13.5px;}
  .toggle-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-bottom:10px;}

  /* bottom tab bar */
  .tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;z-index:30;}
  .tabbar-inner{width:100%;max-width:760px;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:10px;font-size:12px;font-weight:600;color:var(--ink-soft);}
  .tab .ic{font-size:19px;}
  .tab.active{color:var(--green);background:var(--green-soft);}

  /* modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(33,30,25,0.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;}
  .modal{width:100%;max-width:760px;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;}
  .modal-title{font-family:var(--font-display);font-weight:700;font-size:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
  .modal-close{font-size:20px;color:var(--ink-soft);padding:4px;}
  .modal-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .modal-item:last-child{border-bottom:none;}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,0.25);transition:opacity 0.3s, transform 0.3s;}
  .small-link{font-size:13px;color:var(--green);font-weight:600;text-decoration:underline;}
  .btn-scan{margin-top:8px;width:100%;background:var(--ink);color:#fff;border-radius:10px;padding:11px;font-weight:600;font-size:14px;}
  .scan-wrap{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3;margin-bottom:12px;}
  .scan-wrap video{width:100%;height:100%;object-fit:cover;}
  .scan-frame{position:absolute;inset:18%;border:2px solid var(--green);border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,0.35);}
  .scan-close{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.55);color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;}
  .scan-note{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-bottom:10px;}
  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;color:var(--ink-soft);font-family:var(--font-mono);font-size:13px;gap:10px;}
  .spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--green);animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none;}}
  .qty-display-btn{width:100%;padding:13px 14px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface-2);font-family:var(--font-mono);font-weight:600;font-size:17px;text-align:center;}
  .numpad-display{font-family:var(--font-mono);font-size:32px;font-weight:700;text-align:center;background:var(--surface-2);border-radius:10px;padding:14px;margin-bottom:14px;letter-spacing:0.02em;}
  .numpad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .numpad-grid button{padding:18px 0;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:20px;font-weight:600;font-family:var(--font-mono);}
  .numpad-grid button.numpad-clear{color:var(--danger);}
  .numpad-grid button.numpad-back{color:var(--ink-soft);}
  .numpad-confirm{margin-top:12px;width:100%;background:var(--green);color:#fff;border-radius:10px;padding:14px;font-weight:600;font-size:15px;}
</style>
</head>

function norm(s){ return (s||'').toString().toUpperCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); }
function compact(s){ return norm(s).replace(/\s+/g,''); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function artClass(art){ const a=(art||'').toLowerCase(); if(a==='toner')return 'toner'; if(a==='tinte')return 'tinte'; if(a==='fuser')return 'fuser'; if(a==='wt')return 'wt'; return 'toner'; }
function palletsSum(a){ return (a.pallets||[]).reduce((s,p)=>s+Number(p.qty||0),0); }
function unassignedQty(a){ return Math.max(0, Number(a.qty||0) - palletsSum(a)); }
function naturalSortKey(normId){
  // Letters-prefix first, then grouped by digit-length of the trailing number, then by numeric value.
  // e.g. TK17, TK18 (2-digit) sort before TK130 (3-digit) before TK1150 (4-digit), even though
  // plain numeric/alpha sorting would interleave them.
  const m = normId.match(/^(.*?)(\d+)(.*)$/);
  if(!m) return { prefix: normId, len: 0, num: 0, suffix: '' };
  return { prefix: m[1], len: m[2].length, num: Number(m[2]), suffix: m[3] };
}
function compareArticles(a,b){
  const ka = a._sortKey, kb = b._sortKey;
  if(ka.prefix !== kb.prefix) return ka.prefix.localeCompare(kb.prefix);
  if(ka.len !== kb.len) return ka.len - kb.len;
  if(ka.num !== kb.num) return ka.num - kb.num;
  return ka.suffix.localeCompare(kb.suffix);
}
function bestPrice(a){
  if(!a.prices) return null;
  let bestKey=null, bestVal=-Infinity;
  for(const k in PRICE_LABELS){
    const v = a.prices[k];
    if(typeof v === 'number' && v>bestVal){ bestVal=v; bestKey=k; }
  }
  if(bestKey==null) return null;
  return { key:bestKey, label:PRICE_LABELS[bestKey], value:bestVal };
}

async function storageGet(key){
  try{
    const res = await fetch(
      `${SB_URL}/rest/v1/kv_store?key=eq.${encodeURIComponent(key)}&select=value`,
      { headers: SB_HEADERS }
    );
    if(!res.ok) return null;
    const rows = await res.json();
    return rows.length > 0 ? rows[0].value : null;
  }catch(e){ return null; }
}

async function storageSet(key, value){
  try{
    const toSave = (key === 'articles' && Array.isArray(value))
      ? stripCacheFromArticles(value) : value;
    const res = await fetch(`${SB_URL}/rest/v1/kv_store`, {
      method: 'POST',
      headers: { ...SB_HEADERS, 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify({ key, value: toSave, updated_at: new Date().toISOString() })
    });
    if(!res.ok){
      const txt = await res.text().catch(()=>'');
      state.supabaseError = `HTTP ${res.status}: ${txt.slice(0,200)}`;
    }
    return res.ok;
  }catch(e){
    state.supabaseError = `Netzwerkfehler: ${e.message}`;
    return false;
  }
}

      storageSet('articles', state.articles).then(ok=>{ if(!ok) persistent=false; });
    } else {
      // Network error → use SEED for display but do NOT save (don't overwrite real data)
      state.articles = SEED_ARTICLES.map(a=>({...a}));
      persistent = false;
      state.supabaseError = 'Keine Verbindung zu Supabase – lokale Seed-Daten werden angezeigt. Bitte Seite neu laden.';
    }
  }catch(e){
    state.articles = SEED_ARTICLES.map(a=>({...a}));
    persistent = false;
    state.supabaseError = `Ladefehler: ${e.message}`;
  }

  try{
    const a = await storageGet('aliases');
    if(a) state.aliases = a;
    else if(networkOk){
      state.aliases = {...ALIAS_SEED};
      storageSet('aliases', state.aliases);
    } else { state.aliases = {...ALIAS_SEED}; }
  }catch(e){ state.aliases = {...ALIAS_SEED}; }

  try{
    const t = await storageGet('transactions');
    state.transactions = t || [];
  }catch(e){ state.transactions = []; }

  try{
    const l = await storageGet('locations');
    if(l) state.locations = l;
    else if(networkOk){
      state.locations = Array.from(new Set(SEED_ARTICLES.map(a=>a.ort).filter(Boolean))).sort();
      storageSet('locations', state.locations);
    } else {
      state.locations = Array.from(new Set(SEED_ARTICLES.map(a=>a.ort).filter(Boolean))).sort();
    }
  }catch(e){
    state.locations = Array.from(new Set(SEED_ARTICLES.map(a=>a.ort).filter(Boolean))).sort();
  }

  state.persistent = persistent;
  reindexArticles();
  try{
    const lastReminder = await storageGet('lastBackupReminder');
    const today = new Date().toISOString().slice(0,10);
    if(!lastReminder || lastReminder !== today){
      state.showDailyBackupBanner = true;
    }
  }catch(e){ state.showDailyBackupBanner = true; }
  state.loaded = true;
}
function reindexArticles(){
  state.articles.forEach(a=>{
    a._norm = norm(a.id);
    a._compact = compact(a.id);
    a._normMarke = norm(a.marke);
    a._normOrt = norm(a.ort);
    a._normBez1 = norm(a.bez1||'');
    a._normBez2 = norm(a.bez2||'');
    a._sortKey = naturalSortKey(a._norm);
  });
}

async function saveArticles(){
  // Fire-and-forget: update UI immediately, save to storage in background
  storageSet('articles', state.articles)
    .then(ok=>{ if(!ok) state.persistent=false; })
    .catch(()=>{ state.persistent=false; });
  state.pendingBackupReminder = true;
}
async function dismissDailyBackupBanner(){
  state.showDailyBackupBanner = false;
  storageSet('lastBackupReminder', new Date().toISOString().slice(0,10)).catch(()=>{});
  render();
}
async function saveAliases(){ storageSet('aliases', state.aliases).catch(()=>{}); }
async function saveLocations(){ storageSet('locations', state.locations).catch(()=>{}); }
async function logTransaction(entry){
  state.transactions.push({ ts: nowIso(), ...entry });
  if(state.transactions.length > 400) state.transactions = state.transactions.slice(-400);
  storageSet('transactions', state.transactions).catch(()=>{});
}

/* ---------- search / alias resolution ---------- */
function findByExactId(id){
  const q = norm(id);
  return state.articles.find(a=>(a._norm!==undefined?a._norm:norm(a.id))===q) || null;
}
function findAliasSuggestion(query){
  const q = compact(query);
  if(q.length < 4) return null;
  let best = null, bestLen = 0;
  for(const a of state.articles){
    const id = a._compact!==undefined ? a._compact : compact(a.id);
    if(id.length>=4 && id.length<q.length && q.startsWith(id)){
      if(id.length>bestLen){ best=a; bestLen=id.length; }
    }
  }
  return best;
}
function resolveAliasMap(query){
  const q = norm(query);
  if(state.aliases[q]) return findByExactId(state.aliases[q]);
  return null;
}
function searchArticles(query, opts={}){
  const onlyStock = !!opts.onlyStock;
  const art = opts.art && opts.art!=='Alle' ? opts.art : null;
  const ort = opts.ort && opts.ort!=='Alle' ? opts.ort : null;
  const q = norm(query);
  const qc = compact(query);
  let list = state.articles.filter(a=>{
    if(onlyStock && !(a.qty>0)) return false;
    if(art && a.art!==art) return false;
    if(ort && a.ort!==ort) return false;
    if(!q) return true;
    return a._norm.includes(q) || a._compact.includes(qc) || a._normBez1.includes(q) || a._normBez2.includes(q) || a._normMarke.includes(q) || a._normOrt.includes(q);
  });
  if(q){
    list.sort((a,b)=>{
      const as = a._norm===q?0:a._norm.startsWith(q)?1:2;
      const bs = b._norm===q?0:b._norm.startsWith(q)?1:2;
      return as-bs || compareArticles(a,b);
    });
  } else {
    list.sort(compareArticles);
  }
  return list;
}

    return html;
  }

  if(!state.inventurOrt){
    html += `<div class="empty-state">Wähle oben den Ort oder die Palette, die du gerade abzählst – es werden nur die Artikel angezeigt, die dort gelistet sind.</div>`;
    return html;
  }

  // Handle "Ohne Lagerort" view
  const isNoOrt = state.inventurOrt === '__KEIN_ORT__';
  const items = isNoOrt
    ? state.articles.filter(a=>!a.ort).sort(compareArticles)
    : state.articles.filter(a=>a.ort===state.inventurOrt).sort(compareArticles);

  html += `<div class="section-title">${isNoOrt ? 'Ohne Lagerort' : escapeHtml(state.inventurOrt)} · ${items.length} Artikel</div>`;
  if(!items.length){
    html += `<div class="empty-state">${isNoOrt ? 'Alle Artikel mit Bestand haben bereits einen Lagerort.' : 'Für diesen Ort sind aktuell keine Artikel hinterlegt.'}</div>`;
  } else {
    if(isNoOrt){
      html += `<div class="banner" style="background:var(--amber-soft);color:#6B4416;border-color:#E6C892;margin-bottom:10px;">Hier kannst du Bestände erfassen und danach über <b>Artikel bearbeiten</b> (✎ im Suche-Tab) einen Lagerort zuweisen.</div>`;
    }
    items.forEach(a=>{
      const kartonIst = unassignedQty(a);
      const palSum = palletsSum(a);
      const draftVal = state.inventurDraft.hasOwnProperty(a.id) ? state.inventurDraft[a.id] : kartonIst;
      const changed = Number(draftVal) !== Number(kartonIst);
      html += `
        <div class="count-row ${changed?'changed':''}">
          <div class="info"><div class="id">${escapeHtml(a.id)}</div><div class="sub">${escapeHtml(a.marke||'–')}${a.bez1?` · <i>${escapeHtml(a.bez1)}</i>`:''}${palSum>0?` · + ${palSum} Stk. auf Palette(n), separat erfasst`:''}</div></div>
          <button class="qty-display-btn" style="width:72px;" data-action="open-numpad" data-kind="inventur" data-key="${escapeHtml(a.id)}">${draftVal}</button>
        </div>`;
    });
    const changedCount = Object.keys(state.inventurDraft).filter(id=>{
      const a = state.articles.find(x=>x.id===id);
      return a && Number(state.inventurDraft[id])!==Number(unassignedQty(a));
    }).length;
    html += `<div class="sticky-cta" data-action="confirm-inventur">${changedCount>0 ? `${changedCount} Änderung(en) speichern` : 'Zählung speichern'}</div>`;
  }
  return html;
}

function renderInventurPalette(nr){
  const items = state.articles.filter(a=>(a.pallets||[]).some(p=>norm(p.nr)===norm(nr) && Number(p.qty)>0))
    .sort(compareArticles);
  let html = `<div class="section-title">Palette ${escapeHtml(nr)} · ${items.length} Artikel</div>`;
  if(!items.length){
    html += `<div class="empty-state">Keine Artikel auf dieser Palette.</div>`;
    return html;
  }
  let anyChanged = false;
  items.forEach(a=>{
    const entry = a.pallets.find(p=>norm(p.nr)===norm(nr));
    const origBoxes = (entry.boxes && entry.boxes.length) ? entry.boxes : [entry.qty];
    const draftBoxes = state.inventurPaletteDraft.hasOwnProperty(a.id) ? state.inventurPaletteDraft[a.id] : origBoxes.slice();
    const draftTotal = draftBoxes.reduce((s,v)=>s+Number(v||0),0);
    const changed = draftTotal !== Number(entry.qty) || draftBoxes.length !== origBoxes.length;
    if(changed) anyChanged = true;
    html += `
      <div class="count-row ${changed?'changed':''}" style="flex-direction:column;align-items:stretch;">
        <div class="info" style="margin-bottom:8px;">
          <div class="id">${escapeHtml(a.id)}</div>
          <div class="sub">${escapeHtml(a.marke||'–')}${a.bez1?` · <i>${escapeHtml(a.bez1)}</i>`:''} · Gesamt-Bestand: ${a.qty} Stk. · auf dieser Palette: Σ <b>${draftTotal}</b> Stk.</div>
        </div>
        ${draftBoxes.map((b,i)=>`
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
            <span style="font-size:13px;color:var(--ink-soft);min-width:64px;">Karton ${i+1}</span>
            <button class="qty-display-btn" style="width:80px;" data-action="open-numpad" data-kind="inventur-box" data-key="${escapeHtml(a.id)}" data-box-idx="${i}">${b} Stk.</button>
            ${draftBoxes.length>1?`<button data-action="inventur-remove-box" data-id="${escapeHtml(a.id)}" data-box-idx="${i}" style="color:var(--danger);font-size:18px;padding:4px 8px;">✕</button>`:''}
          </div>`).join('')}
        <button class="small-link" data-action="inventur-add-box" data-id="${escapeHtml(a.id)}" style="margin-top:4px;">+ Karton hinzufügen</button>
      </div>`;
  });
  html += `<div class="sticky-cta" data-action="confirm-inventur-palette" data-nr="${escapeHtml(nr)}">${anyChanged ? 'Änderungen speichern' : 'Zählung speichern'}</div>`;
  return html;
}

function showToast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(-50%) translateY(8px)'; }, 1800);
  setTimeout(()=>el.remove(), 2200);
}
function showBackupToast(){
  const el = document.createElement('div');
  el.className='toast';
  el.style.cssText='background:#664D03;max-width:280px;text-align:center;cursor:pointer;';
  el.innerHTML='💾 Backup nicht vergessen! Jetzt CSV exportieren.';
  el.onclick=()=>{ el.remove(); document.querySelector('[data-action="set-tab"][data-tab="suche"]')?.click(); };
  document.body.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(-50%) translateY(8px)'; }, 4000);
  setTimeout(()=>el.remove(), 4500);
}

/* ---------- CSV export ---------- */
function toCsv(rows){
  const headers = ['Art','Ort','OEM','Marke','Artikel','Bezeichnung 2','Lagerstand','Paletten'];
  const lines = [headers.join(';')];
  rows.forEach(a=>{
    const palStr = (a.pallets && a.pallets.length)
      ? a.pallets.map(p=>'Pal.'+p.nr+'x'+p.qty+'Stk').join(' | ')
      : '';
    const vals = [a.art,a.ort,a.oem,a.marke,a.id,a.bez2,a.qty,palStr].map(v=>{
      let s = (v==null?'':String(v));
      if(s.includes(';')||s.includes('"')) s = '"'+s.replace(/"/g,'""')+'"';
      return s;
    });
    lines.push(vals.join(';'));
  });
  return lines.join('\n');
}
function downloadCsv(filename, csvText){
  const blob = new Blob(['\ufeff'+csvText], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ---------- scan engine (progressive enhancement) ---------- */
let scanStream = null, scanLoopHandle = null, scanDetector = null;
async function startScan(target){
  state.scanTarget = target; state.scanError = null; state.modal='scan';
  render();
  if(!('BarcodeDetector' in window)){
    state.scanError = 'Scannen wird auf diesem Gerät/Browser leider nicht unterstützt (z. B. auf manchen iPhones/iPads). Bitte den Code stattdessen eintippen – die Texterkennung erkennt auch Varianten automatisch.';
    render();
    return;
  }
  try{
    scanDetector = new BarcodeDetector();
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const video = document.getElementById('scanVideo');
    if(!video){ stopScan(); return; }
    video.srcObject = scanStream;
    await video.play();
    const loop = async ()=>{
      if(!state.scanOpenFlag && state.modal!=='scan') return;
      try{
        const codes = await scanDetector.detect(video);
        if(codes && codes.length){
          const value = codes[0].rawValue;
          handleScanResult(value);
          return;
        }
      }catch(e){}
      scanLoopHandle = requestAnimationFrame(loop);
    };
    state.scanOpenFlag = true;
    scanLoopHandle = requestAnimationFrame(loop);
  }catch(e){
    state.scanError = 'Kamera-Zugriff nicht möglich. Bitte Kamera-Berechtigung im Browser erlauben oder den Code eintippen.';
    render();
  }
}
function stopScan(){
  state.scanOpenFlag = false;
  if(scanLoopHandle) cancelAnimationFrame(scanLoopHandle);
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
}
function handleScanResult(rawValue){
  stopScan();
  state.modal = null;
  const target = state.scanTarget;
  const direct = findByExactId(rawValue);
  const resolved = direct || resolveAliasMap(rawValue) || findAliasSuggestion(rawValue);
  if(target==='eingang'){
    state.eingangQuery = rawValue;
    if(resolved){ state.eingangSelected = resolved; state.eingangQty=1; state.eingangOrt=resolved.ort; }
    state.showPalletForm=false; state.palletNr=''; state.palletQty=null;
  } else if(target==='verkauf'){
    state.verkaufQuery = rawValue;
    if(resolved){ state.verkaufSelected = resolved; state.verkaufMode=null; state.verkaufQty=1; state.verkaufPalette=''; }
  }
  showToast(resolved ? 'Erkannt: '+resolved.id : 'Code „'+rawValue+'" nicht gefunden');
  render();
}

/* ---------- event handling ---------- */
/* Reads all edit-modal input values from the DOM into state.editDraft.
   Called before any action that re-renders the modal (add/remove palette, confirm). */
function _saveEditFieldsToDraft(){
  if(!state.editDraft) return;
  const d = state.editDraft;
  const g = id => { const el=document.getElementById(id); return el?el.value:null; };
  if(g('editId')!==null) d.id = g('editId').trim();
  if(g('editArt')!==null) d.art = g('editArt');
  if(g('editMarke')!==null) d.marke = g('editMarke');
  if(g('editOem')!==null) d.oem = g('editOem');
  if(g('editBez1')!==null) d.bez1 = g('editBez1');
  if(g('editBez2')!==null) d.bez2 = g('editBez2');
  if(g('editOrt')!==null) d.ort = g('editOrt');
  if(g('editQty')!==null) d.qty = Number(g('editQty')||0);
  // Pallets
  (d.pallets||[]).forEach((p,pi)=>{
    const nrEl = document.getElementById('editPalNr_'+pi);
    const boxEl = document.getElementById('editPalBoxes_'+pi);
    if(nrEl) p.nr = nrEl.value.trim();
    if(boxEl){
      const boxes = boxEl.value.split(/[\s,;]+/).map(v=>Number(v.trim())).filter(v=>!isNaN(v)&&v>0);
      p.boxes = boxes.length ? boxes : [0];
      p.qty = p.boxes.reduce((s,v)=>s+v, 0);
    }
  });
  // Prices
  if(!d.prices) d.prices = {};
  Object.keys(PRICE_LABELS).forEach(k=>{
    const el = document.getElementById('editPrice_'+k);
    if(el) d.prices[k] = el.value!=='' ? Number(el.value) : null;
  });
}

document.addEventListener('click', async (e)=>{
  const backdrop = e.target.closest('.modal-backdrop');
  if(backdrop && !e.target.closest('[data-stop]')){ if(state.modal==='scan') stopScan(); state.modal=null; state.numpad=null; render(); return; }

  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  if(action==='set-tab'){ state.activeTab=t.dataset.tab; if(t.dataset.tab!=='eingang'){state.eingangSelected=null;} render(); return; }
  if(action==='do-search'){
    // Read the current value from the input field (user may have typed without Enter)
    const bindTarget = t.dataset.bindTarget;
    const inp = document.querySelector(`[data-bind="${bindTarget}"]`);
    if(inp) state[bindTarget] = inp.value;
    render();
    restoreFocusAndCaret(`[data-bind="${bindTarget}"]`);
    return;
  }
  if(action==='close-modal'){
    if(t.classList.contains('modal-backdrop') && e.target.closest('[data-stop]')) return;
    state.modal=null; state.editId=null; state.editDraft=null; render(); return;
  }
  if(action==='open-scan'){ await startScan(t.dataset.target); return; }
  if(action==='close-scan'){ stopScan(); state.modal=null; render(); return; }
  if(action==='dismiss-backup-banner'){ dismissDailyBackupBanner(); return; }
  if(action==='quick-export'){
    const results = searchArticles('', {onlyStock: false});
    const date = new Date().toISOString().slice(0,10);
    const time = new Date().toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'}).replace(':','');
    downloadCsv(`Lagerstand_${date}_${time}.csv`, toCsv(results));
    showToast('💾 Backup exportiert!');
    return;
  }
  if(action==='trigger-import-csv'){
    const inp = document.getElementById('csvImportInput');
    if(inp) inp.click();
    return;
  }
  if(action==='open-settings'){ state.modal='settings'; render(); return; }
  if(action==='open-numpad'){
    const kind = t.dataset.kind, key = t.dataset.key, boxIdx = t.dataset.boxIdx!=null && t.dataset.boxIdx!=='' ? Number(t.dataset.boxIdx) : null;
    state.numpad = { kind, key, boxIdx, value: getNumpadInitial(kind, key, boxIdx) };
    state.modal = 'numpad';
    render();
    return;
  }
  if(action==='close-numpad'){ state.numpad=null; state.modal=null; render(); return; }
  if(action==='numpad-digit'){
    if(!state.numpad) return;
    if(state.numpad.value.length>=6) return; // sane upper bound, avoids absurd quantities by mistake
    state.numpad.value += t.dataset.digit;
    render();
    return;
  }
  if(action==='numpad-back'){
    if(!state.numpad) return;
    state.numpad.value = state.numpad.value.slice(0,-1);
    render();
    return;
  }
  if(action==='numpad-clear'){
    if(!state.numpad) return;
    state.numpad.value = '';
    render();
    return;
  }
  if(action==='numpad-confirm'){ commitNumpad(); return; }

  if(action==='select-eingang'){
    const a = findByExactId(t.dataset.id);
    if(a){ state.eingangSelected=a; state.eingangQty=1; state.eingangOrt=a.ort; state.showPalletForm=false; state.palletNr=''; state.palletQty=null; render(); }
    return;
  }
  if(action==='use-alias'){
    const a = findByExactId(t.dataset.id);
    if(a){
      const q = t.dataset.query;
      state.aliases[norm(q)] = a.id;
      saveAliases();
      state.eingangSelected=a; state.eingangQty=1; state.eingangOrt=a.ort; state.showPalletForm=false; state.palletNr=''; state.palletQty=null;
      showToast('Zuordnung gespeichert: '+q+' → '+a.id);
      render();
    }
    return;
  }
  if(action==='cancel-eingang'){ state.eingangSelected=null; state.showPalletForm=false; state.palletNr=''; state.palletQty=null; render(); return; }
  if(action==='qty-inc'){ state.eingangQty = Math.max(1, Number(state.eingangQty||1)+1); render(); return; }
  if(action==='qty-dec'){ state.eingangQty = Math.max(1, Number(state.eingangQty||1)-1); render(); return; }
  if(action==='toggle-pallet-form'){
    state.showPalletForm = !state.showPalletForm;
    if(state.showPalletForm){ state.palletNr=''; state.palletQty=null; }
    render();
    return;
  }
  if(action==='confirm-pallet-booking'){
    const a = findByExactId(t.dataset.id);
    const nr = (state.palletNr||'').trim();
    const available = a ? unassignedQty(a) : 0;
    const qty = Math.min(Number(state.palletQty||0), available);
    if(!a || !nr){ showToast('Bitte Palettennummer eingeben'); return; }
    if(qty<=0){ showToast('Nichts Unzugeordnetes zum Verbuchen vorhanden'); return; }
    if(!a.pallets) a.pallets=[];
    const existing = a.pallets.find(p=>norm(p.nr)===norm(nr));
    if(existing){
      existing.qty = Number(existing.qty||0) + qty;
      if(!existing.boxes) existing.boxes = [existing.qty - qty]; // backfill prior aggregate as one box
      existing.boxes.push(qty);
    } else {
      a.pallets.push({nr, qty, boxes:[qty]});
    }
    saveArticles();
    logTransaction({type:'palette', id:a.id, delta:qty, ort:'Palette '+nr});
    showToast('Auf Palette '+nr+' gebucht: '+qty+' Stk. (als neuer Karton erfasst)');
    state.showPalletForm=false; state.palletNr=''; state.palletQty=null;
    render();
    return;
  }
  if(action==='confirm-eingang'){
    const a = findByExactId(t.dataset.id);
    if(a){
      const delta = Number(state.eingangQty||0);
      a.qty = Number(a.qty||0) + delta;
      a.ort = state.eingangOrt || a.ort;
      saveArticles();
      logTransaction({type:'eingang', id:a.id, delta:delta, ort:a.ort});
      showToast('Gebucht: +'+delta+' '+a.id);
      state.eingangSelected=null; state.eingangQuery=''; state.eingangQty=1;
      render();
    }
    return;
  }
  if(action==='new-article'){ state.pendingNewQuery=t.dataset.query||''; state.modal='newarticle'; render(); return; }

  if(action==='open-edit'){
    const a = findByExactId(t.dataset.id);
    if(!a) return;
    // Deep copy for editing
    state.editId = a.id;
    state.editDraft = JSON.parse(JSON.stringify(a));
    state.modal = 'edit';
    render();
    return;
  }
  if(action==='edit-add-pallet'){
    if(!state.editDraft) return;
    state.editDraft.pallets = state.editDraft.pallets || [];
    state.editDraft.pallets.push({nr:'', qty:0, boxes:[0]});
    // Save current field values before re-render
    _saveEditFieldsToDraft();
    state.editDraft.pallets[state.editDraft.pallets.length-1] = {nr:'', qty:0, boxes:[0]};
    render();
    return;
  }
  if(action==='edit-remove-pallet'){
    if(!state.editDraft) return;
    _saveEditFieldsToDraft();
    const pi = Number(t.dataset.pi);
    state.editDraft.pallets.splice(pi, 1);
    render();
    return;
  }
  if(action==='confirm-edit'){
    if(!state.editDraft) return;
    _saveEditFieldsToDraft();
    const d = state.editDraft;
    const newId = d.id.trim();
    if(!newId){ showToast('Artikel-Code darf nicht leer sein'); return; }
    const oldId = state.editId;
    const existing = findByExactId(newId);
    if(newId !== oldId && existing){ showToast('Artikel-Code existiert bereits'); return; }
    const idx = state.articles.findIndex(a=>a.id===oldId);
    if(idx===-1){ showToast('Artikel nicht gefunden'); return; }
    // Recompute cache fields
    d._norm = norm(newId); d._compact = compact(newId);
    d._normMarke = norm(d.marke||''); d._normOrt = norm(d.ort||'');
    d._normBez1 = norm(d.bez1||''); d._normBez2 = norm(d.bez2||'');
    d._sortKey = naturalSortKey(d._norm);
    state.articles[idx] = d;
    // Update alias if id changed
    if(newId !== oldId){
      Object.keys(state.aliases).forEach(k=>{ if(state.aliases[k]===oldId) state.aliases[k]=newId; });
      saveAliases();
    }
    saveArticles();
    logTransaction({type:'bearbeitung', id:newId, oldId: newId!==oldId?oldId:undefined});
    showToast('Artikel gespeichert: '+newId);
    state.modal=null; state.editId=null; state.editDraft=null;
    render();
    return;
  }
  if(action==='delete-article'){
    const id = t.dataset.id;
    if(!confirm(`Artikel "${id}" wirklich löschen? Das kann nicht rückgängig gemacht werden.`)) return;
    state.articles = state.articles.filter(a=>a.id!==id);
    saveArticles();
    showToast('Artikel gelöscht: '+id);
    state.modal=null; state.editId=null; state.editDraft=null;
    render();
    return;
  }
  if(action==='confirm-new-article'){
    const id = document.getElementById('newArtId').value.trim();
    if(!id){ showToast('Bitte Artikel-Code eingeben'); return; }
    if(findByExactId(id)){ showToast('Artikel existiert bereits'); return; }
    const art = document.getElementById('newArtArt').value;
    const marke = document.getElementById('newArtMarke').value;
    const oem = document.getElementById('newArtOem').value;
    const bez1 = document.getElementById('newArtBez1').value;
    const bez2 = document.getElementById('newArtBez2').value;
    const ort = document.getElementById('newArtOrt').value;
    const qty = Number(document.getElementById('newArtQty').value||0);
    const prices = {};
    Object.keys(PRICE_LABELS).forEach(k=>{
      const el = document.getElementById('newArtPrice_'+k);
      const v = el && el.value !== '' ? Number(el.value) : null;
      prices[k] = (v!=null && !isNaN(v)) ? v : null;
    });
    const newArticle = {id, art, ort, oem, marke, bez1, bez2, qty, pallets:[], prices};
    newArticle._norm = norm(id); newArticle._compact = compact(id);
    newArticle._normMarke = norm(marke); newArticle._normOrt = norm(ort);
    newArticle._normBez1 = norm(bez1); newArticle._normBez2 = norm(bez2);
    newArticle._sortKey = naturalSortKey(newArticle._norm);
    state.articles.push(newArticle);
    saveArticles();
    logTransaction({type:'neuanlage', id, delta:qty, ort});
    showToast('Artikel angelegt: '+id);
    state.modal=null; state.eingangQuery=''; state.eingangSelected=null;
    render();
    return;
  }

  if(action==='select-verkauf'){
    const a = findByExactId(t.dataset.id);
    if(a){ state.verkaufSelected=a; state.verkaufMode=null; state.verkaufQty=1; state.verkaufPalette=''; render(); }
    return;
  }
  if(action==='verkauf-cancel'){ state.verkaufSelected=null; state.verkaufMode=null; state.verkaufSelectedBoxes=[]; render(); return; }
  if(action==='verkauf-voll'){ state.verkaufMode='voll'; render(); return; }
  if(action==='verkauf-teil-start'){
    state.verkaufMode='teil';
    state.verkaufQty=1;
    state.verkaufPalette='';
    state.verkaufSelectedBoxes=[];
    render();
    return;
  }
  if(action==='toggle-box-sel'){
    const idx = Number(t.dataset.idx);
    const sel = state.verkaufSelectedBoxes || [];
    if(sel.includes(idx)) state.verkaufSelectedBoxes = sel.filter(i=>i!==idx);
    else state.verkaufSelectedBoxes = [...sel, idx].sort((a,b)=>a-b);
    render();
    return;
  }
  if(action==='vqty-dec'){ state.verkaufQty=Math.max(1, Number(state.verkaufQty||1)-1); render(); return; }
  if(action==='confirm-verkauf-voll'){
    const a = findByExactId(t.dataset.id);
    if(a){
      const bp = bestPrice(a);
      logTransaction({type:'verkauf', id:a.id, delta:-Number(a.qty||0), customer: bp?bp.label:'', price: bp?bp.value:null});
      a.qty = 0; a.pallets = [];
      saveArticles();
      showToast('Verkauf gebucht: '+a.id+' (kompletter Bestand)');
      state.verkaufSelected=null; state.verkaufMode=null; state.verkaufQuery='';
      render();
    }
    return;
  }
  if(action==='confirm-verkauf-teil'){
    const a = findByExactId(t.dataset.id);
    if(a){
      const palNr = state.verkaufPalette;
      const selBoxes = state.verkaufSelectedBoxes || [];
      const entry = palNr ? (a.pallets||[]).find(p=>norm(p.nr)===norm(palNr)) : null;
      const hasBoxSel = entry && entry.boxes && entry.boxes.length>1 && selBoxes.length>0;

      let qty = 0;
      if(hasBoxSel){
        // Box-selection mode: remove exactly the chosen boxes
        qty = selBoxes.reduce((s,i)=>s+Number(entry.boxes[i]||0),0);
        entry.boxes = entry.boxes.filter((_,i)=>!selBoxes.includes(i));
        entry.qty = entry.boxes.reduce((s,b)=>s+b,0);
        a.pallets = (a.pallets||[]).filter(p=>Number(p.qty)>0);
      } else {
        // Manual quantity mode
        qty = Math.min(Number(state.verkaufQty||0), Number(a.qty||0));
        if(qty<=0){ showToast('Ungültige Menge'); return; }
        if(entry){
          let remaining = qty;
          if(!entry.boxes || !entry.boxes.length) entry.boxes = [entry.qty];
          for(let i=entry.boxes.length-1; i>=0 && remaining>0; i--){
            const take = Math.min(entry.boxes[i], remaining);
            entry.boxes[i] -= take; remaining -= take;
          }
          entry.boxes = entry.boxes.filter(b=>b>0);
          entry.qty = entry.boxes.reduce((s,b)=>s+b,0);
          a.pallets = (a.pallets||[]).filter(p=>Number(p.qty)>0);
        }
      }

      a.qty = Math.max(0, Number(a.qty||0) - qty);
      const bp = bestPrice(a);
      saveArticles();
      logTransaction({type:'verkauf', id:a.id, delta:-qty, ort: palNr?('Palette '+palNr):'', customer: bp?bp.label:'', price: bp?bp.value:null});
      showToast('Verkauf gebucht: -'+qty+' Stk. '+a.id+(hasBoxSel?' ('+selBoxes.length+' Karton(s))':''));
      state.verkaufSelected=null; state.verkaufMode=null; state.verkaufQuery=''; state.verkaufSelectedBoxes=[];
      render();
    }
    return;
  }

  if(action==='set-inventur-ort'){ state.inventurOrt=t.dataset.ort; state.inventurPalette=null; state.inventurDraft={}; render(); return; }
  if(action==='set-inventur-palette'){ state.inventurPalette=t.dataset.nr; state.inventurOrt=null; state.inventurPaletteDraft={}; render(); return; }
  if(action==='new-location'){ state.modal='newlocation'; render(); return; }
  if(action==='confirm-new-location'){
    const val = document.getElementById('newLocationInput').value.trim();
    if(val && !state.locations.includes(val)){
      state.locations.push(val); state.locations.sort();
      saveLocations();
      showToast('Ort angelegt: '+val);
    }
    state.modal=null; render();
    return;
  }
  if(action==='confirm-inventur'){
    const changes = [];
    Object.keys(state.inventurDraft).forEach(id=>{
      const a = state.articles.find(x=>x.id===id);
      if(!a) return;
      const oldKarton = unassignedQty(a);
      const newKarton = Number(state.inventurDraft[id]);
      if(oldKarton !== newKarton){
        const oldTotal = a.qty;
        a.qty = newKarton + palletsSum(a);
        changes.push({id, before:oldTotal, after:a.qty, kartonBefore:oldKarton, kartonAfter:newKarton});
      }
    });
    if(changes.length){
      saveArticles();
      logTransaction({type:'inventur', ort:state.inventurOrt, changes});
      showToast(changes.length+' Bestand(e) aktualisiert');
    }
    state.inventurDraft={};
    render();
    return;
  }
  if(action==='confirm-inventur-palette'){
    const nr = t.dataset.nr;
    const changes = [];
    Object.keys(state.inventurPaletteDraft).forEach(id=>{
      const a = state.articles.find(x=>x.id===id);
      if(!a || !a.pallets) return;
      const entry = a.pallets.find(p=>norm(p.nr)===norm(nr));
      if(!entry) return;
      const newBoxes = (state.inventurPaletteDraft[id]||[]).map(v=>Number(v||0)).filter(v=>v>0);
      const newTotal = newBoxes.reduce((s,v)=>s+v,0);
      if(newTotal !== Number(entry.qty)){
        const delta = newTotal - Number(entry.qty);
        changes.push({id, before:entry.qty, after:newTotal, boxesBefore:entry.boxes, boxesAfter:newBoxes});
        entry.qty = newTotal;
        entry.boxes = newBoxes;
        a.qty = Math.max(0, Number(a.qty||0) + delta);
      }
    });
    state.articles.forEach(a=>{ if(a.pallets) a.pallets = a.pallets.filter(p=>Number(p.qty)>0); });
    if(changes.length){
      saveArticles();
      logTransaction({type:'inventur-palette', ort:'Palette '+nr, changes});
      showToast(changes.length+' Bestand(e) aktualisiert');
    }
    state.inventurPaletteDraft={};
    render();
    return;
  }
  if(action==='inventur-add-box'){
    const id = t.dataset.id;
    const a = state.articles.find(x=>x.id===id);
    if(!a) return;
    if(!state.inventurPaletteDraft[id]){
      const entry = (a.pallets||[]).find(p=>norm(p.nr)===norm(state.inventurPalette));
      state.inventurPaletteDraft[id] = entry && entry.boxes && entry.boxes.length ? entry.boxes.slice() : [entry?entry.qty:0];
    }
    state.inventurPaletteDraft[id].push(0);
    render();
    return;
  }
  if(action==='inventur-remove-box'){
    const id = t.dataset.id;
    const boxIdx = Number(t.dataset.boxIdx);
    const a = state.articles.find(x=>x.id===id);
    if(!a) return;
    if(!state.inventurPaletteDraft[id]){
      const entry = (a.pallets||[]).find(p=>norm(p.nr)===norm(state.inventurPalette));
      state.inventurPaletteDraft[id] = entry && entry.boxes && entry.boxes.length ? entry.boxes.slice() : [entry?entry.qty:0];
    }
    state.inventurPaletteDraft[id].splice(boxIdx, 1);
    if(!state.inventurPaletteDraft[id].length) state.inventurPaletteDraft[id] = [0];
    render();
    return;
  }

  if(action==='export-csv'){
    const results = searchArticles(state.sucheQuery, {art:state.sucheArt, ort:state.sucheOrt, onlyStock:state.sucheOnlyStock});
    downloadCsv('Lagerstand_'+new Date().toISOString().slice(0,10)+'.csv', toCsv(results));
    showToast('CSV-Export gestartet');
    return;
  }
  if(action==='export-log'){
    const lines = ['Zeit;Typ;Artikel;Menge;Ort;Kunde;Preis'];
    state.transactions.forEach(tx=>{
      lines.push([fmtTime(tx.ts), tx.type, tx.id||'', tx.delta!=null?tx.delta:'', tx.ort||'', tx.customer||'', tx.price!=null?tx.price:''].join(';'));
    });
    downloadCsv('Buchungsverlauf.csv', lines.join('\n'));
    return;
  }
  if(action==='reset-data'){
    if(!confirm('Wirklich alle Daten auf den Originalbestand aus der Excel-Liste zurücksetzen? Das kann nicht rückgängig gemacht werden.')) return;
    state.articles = SEED_ARTICLES.map(a=>({...a}));
    state.aliases = {...ALIAS_SEED}; state.transactions = [];
    reindexArticles();
    saveArticles(); saveAliases();
    try{ await storageSet('transactions', state.transactions); }catch(e){}
    state.modal=null;
    showToast('Daten zurückgesetzt');
    render();
    return;
  }
});

function restoreFocusAndCaret(selector){
  requestAnimationFrame(()=>{
    const sel = document.querySelector(selector);
    if(sel && (sel.tagName==='INPUT' || sel.tagName==='SELECT')){
      sel.focus();
      if(sel.tagName==='INPUT' && sel.type==='text' && sel.setSelectionRange){
        try{ const len = sel.value.length; sel.setSelectionRange(len, len); }catch(err){}
      }
    }
  });
}

document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Enter') return;
  const bind = e.target.dataset.bind;
  if(bind && ['eingangQuery','verkaufQuery','sucheQuery'].includes(bind)){
    render();
    restoreFocusAndCaret(`[data-bind="${bind}"]`);
  }
});

document.addEventListener('input', (e)=>{
  const bind = e.target.dataset.bind;
  if(bind){
    if(e.target.type==='checkbox'){ state[bind] = e.target.checked; render(); return; }
    state[bind] = e.target.value;
    // Search fields: only update state here, render fires on Enter or search button
    if(['eingangQuery','verkaufQuery','sucheQuery'].includes(bind)){
      if(bind==='eingangQuery') state.eingangSelected=null;
      if(bind==='verkaufQuery'){ state.verkaufSelected=null; state.verkaufMode=null; }
      return; // no render yet
    }
    if(bind==='verkaufPalette'){ state.verkaufSelectedBoxes=[]; }
    render();
    restoreFocusAndCaret(`[data-bind="${bind}"]`);
    return;
  }
});

// CSV import via file input
document.addEventListener('change', (e)=>{
  if(e.target.tagName === 'SELECT'){
    const bind = e.target.dataset.bind;
    if(!bind) return;
    state[bind] = e.target.value;
    if(bind==='verkaufPalette'){ state.verkaufSelectedBoxes=[]; }
    render();
    return;
  }
  if(e.target.id === 'csvImportInput' || e.target.dataset.action === 'import-csv'){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      try{
        const text = ev.target.result;
        const lines = text.split('\n');
        const sep = lines[0].includes(';') ? ';' : ',';
        const headers = lines[0].replace(/^\uFEFF/,'').split(sep).map(h=>h.trim().replace(/^"|"$/g,''));
        const artIdx = headers.findIndex(h=>h==='Artikel');
        const qtyIdx = headers.findIndex(h=>h==='Lagerstand');
        const ortIdx = headers.findIndex(h=>h==='Ort');
        const palIdx = headers.findIndex(h=>h==='Paletten');
        if(artIdx===-1||qtyIdx===-1){ showToast('CSV-Format nicht erkannt'); return; }
        let updated = 0;
        for(let i=1;i<lines.length;i++){
          const cols = lines[i].split(sep).map(c=>c.trim().replace(/^"|"$/g,''));
          const id = cols[artIdx];
          if(!id) continue;
          const a = findByExactId(id);
          if(!a) continue;
          const qty = Number(cols[qtyIdx]);
          if(!isNaN(qty)) a.qty = qty;
          if(ortIdx>-1 && cols[ortIdx]) a.ort = cols[ortIdx];
          if(palIdx>-1){
            const palStr = cols[palIdx];
            if(palStr){
              const newPallets = [];
              palStr.split('|').forEach(part=>{
                const pm = part.trim().match(/Pal\.(.+?)x(\d+)Stk/);
                if(pm) newPallets.push({nr:pm[1].trim(), qty:Number(pm[2]), boxes:[Number(pm[2])]});
              });
              if(newPallets.length){
                const existingByNr = {};
                (a.pallets||[]).forEach(p=>existingByNr[p.nr]=p);
                a.pallets = newPallets.map(np=>{
                  const ep = existingByNr[np.nr];
                  if(ep && ep.boxes && ep.boxes.length>1 && ep.qty===np.qty) return ep;
                  return np;
                });
              } else {
                a.pallets = []; // paletten-string vorhanden aber nicht parsierbar → leeren
              }
            } else {
              a.pallets = []; // leere paletten-spalte → paletten leeren
            }
          }
          updated++;
        }
        saveArticles();
        state.showDailyBackupBanner = false;
        await storageSet('lastBackupReminder', new Date().toISOString().slice(0,10));
        render();
        showToast(`✓ ${updated} Artikel aus Backup importiert`);
      }catch(err){
        showToast('Fehler beim Importieren: '+err.message);
      }
    };
    reader.readAsText(file, 'utf-8');
    // Reset so same file can be selected again
    e.target.value = '';
  }
});

/* ---------- custom numpad (replaces native number keyboard for quantities) ----------
   Some Android virtual keyboards reorder digits when the page re-renders mid-keystroke
   (a known mobile-web quirk with type="number"/inputmode="numeric" fields combined with
   any DOM update while typing). Quantities in this tool are always entered through this
   on-screen pad instead, which appends digits to a plain JS string - the browser's own
   text-cursor logic is never involved, so there is nothing left to race or reorder. */
function getNumpadInitial(kind, key, boxIdx){
  if(kind==='bind') return String(state[key] ?? '');
  if(kind==='inventur'){
    const a = state.articles.find(x=>x.id===key);
    return String(state.inventurDraft.hasOwnProperty(key) ? state.inventurDraft[key] : (a?unassignedQty(a):0));
  }
  if(kind==='inventur-box'){
    if(state.inventurPaletteDraft[key] && state.inventurPaletteDraft[key][boxIdx]!=null) return String(state.inventurPaletteDraft[key][boxIdx]);
    const a = state.articles.find(x=>x.id===key);
    const entry = a && (a.pallets||[]).find(p=>norm(p.nr)===norm(state.inventurPalette));
    const boxes = entry && entry.boxes && entry.boxes.length ? entry.boxes : [entry?entry.qty:0];
    return String(boxes[boxIdx] ?? 0);
  }
  return '';
}
function commitNumpad(){
  const np = state.numpad;
  if(!np) return;
  const val = np.value === '' ? 0 : Number(np.value);
  if(np.kind==='bind'){ state[np.key] = val; }
  else if(np.kind==='inventur'){ state.inventurDraft[np.key] = val; }
  else if(np.kind==='inventur-box'){
    if(!state.inventurPaletteDraft[np.key]){
      const a = state.articles.find(x=>x.id===np.key);
      const entry = a && (a.pallets||[]).find(p=>norm(p.nr)===norm(state.inventurPalette));
      state.inventurPaletteDraft[np.key] = entry && entry.boxes && entry.boxes.length ? entry.boxes.slice() : [entry?entry.qty:0];
    }
    state.inventurPaletteDraft[np.key][np.boxIdx] = val;
  }
  state.numpad = null;
  state.modal = null;
  render();
}


/* ---------- init ---------- */
(async function init(){
  await loadAll();
  render();
})();
</script>
