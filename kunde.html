<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Leergut-Lager – Verfügbare Artikel</title>
<style>
  :root{
    --bg:#F5F5F0;--surface:#fff;--surface-2:#F0F0EB;--line:#E0DFDA;
    --ink:#1A1A18;--ink-soft:#6B6B65;--accent:#2563EB;--green:#16A34A;
    --green-soft:#DCFCE7;--amber:#D97706;--magenta:#C026D3;--danger:#DC2626;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
  .topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);}
  .subtitle{font-size:12px;color:var(--ink-soft);font-weight:400;}
  .cart-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .cart-badge{background:#fff;color:var(--accent);border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .content{max-width:680px;margin:0 auto;padding:16px;}
  .search-bar{display:flex;gap:8px;margin-bottom:12px;}
  .search-bar input{flex:1;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;background:var(--surface);}
  .search-bar input:focus{outline:none;border-color:var(--accent);}
  .filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .filters select{padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;background:var(--surface);color:var(--ink);}
  .section-title{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
  .article-row{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;}
  .tag-stripe{width:4px;flex-shrink:0;background:var(--ink);}
  .article-row.tinte .tag-stripe{background:var(--magenta);}
  .article-row.fuser .tag-stripe{background:var(--amber);}
  .article-row.wt .tag-stripe{background:var(--green);}
  .article-row-body{flex:1;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .article-id{font-weight:700;font-size:14px;}
  .article-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .article-qty{font-weight:700;font-size:14px;color:var(--green);white-space:nowrap;}
  .add-btn{background:var(--green-soft);color:var(--green);border:none;border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;}
  .add-btn:active{opacity:.7;}
  .loading{text-align:center;padding:40px;color:var(--ink-soft);}
  .error-banner{background:#f8d7da;color:#721c24;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;}
  .empty{text-align:center;padding:40px;color:var(--ink-soft);font-size:14px;}

  /* Cart modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
  .modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:680px;max-height:85vh;overflow-y:auto;padding:20px 16px 32px;}
  .modal-title{font-weight:700;font-size:16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
  .modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);}
  .cart-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .cart-item:last-child{border-bottom:none;}
  .cart-item-info{flex:1;}
  .cart-item-id{font-weight:700;font-size:14px;}
  .cart-item-sub{font-size:12px;color:var(--ink-soft);}
  .qty-control{display:flex;align-items:center;gap:6px;}
  .qty-control button{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;width:30px;height:30px;font-size:16px;cursor:pointer;font-weight:600;}
  .qty-control span{font-weight:700;font-size:14px;min-width:24px;text-align:center;}
  .remove-btn{background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer;padding:4px;}
  .order-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:16px;}
  .order-btn:active{opacity:.8;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .field input,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;}
  .field textarea{min-height:70px;resize:vertical;}
  .cart-empty{text-align:center;padding:30px;color:var(--ink-soft);font-size:14px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:300;animation:fadeup .3s ease;}
  @keyframes fadeup{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="dot"></div><div><div>Leergut-Lager</div><div class="subtitle">Verfügbare Artikel</div></div></div>
  <button class="cart-btn" onclick="openCart()">🛒 Warenkorb <span class="cart-badge" id="cartBadge">0</span></button>
</div>

<div class="content">
  <div id="errorBanner" class="error-banner" style="display:none;"></div>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Code, Marke oder Bezeichnung…" oninput="filterArticles()">
  </div>
  <div class="filters">
    <select id="filterArt" onchange="filterArticles()">
      <option value="">Alle Arten</option>
      <option>Toner</option><option>Tinte</option><option>Fuser</option><option>WT</option>
    </select>
    <select id="filterMarke" onchange="filterArticles()">
      <option value="">Alle Marken</option>
    </select>
  </div>
  <div class="section-title" id="resultCount"></div>
  <div id="articleList"><div class="loading">⏳ Lade Artikel…</div></div>
</div>

<!-- Cart Modal -->
<div class="modal-backdrop" id="cartModal" style="display:none;" onclick="closeCartOnBackdrop(event)">
  <div class="modal">
    <div class="modal-title">Warenkorb <button class="modal-close" onclick="closeCart()">✕</button></div>
    <div id="cartContent"></div>
    <div id="cartForm" style="display:none;margin-top:16px;">
      <div class="field"><label>Ihr Name *</label><input type="text" id="orderName" placeholder="Max Mustermann"></div>
      <div class="field"><label>Ihre E-Mail *</label><input type="email" id="orderEmail" placeholder="max@firma.at"></div>
      <div class="field"><label>Anmerkung (optional)</label><textarea id="orderNote" placeholder="z.B. Liefertermin, Abholung, …"></textarea></div>
      <button class="order-btn" onclick="sendOrder()">📧 Bestellung anfragen</button>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://kmirdmwgtxqzzkhyyyrd.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImttaXJkbXdndHhxenpraHl5eXJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1ODUyNTksImV4cCI6MjEwMDE2MTI1OX0.Dp1hTA3dUNNObsvmSKwhfBqysJQdR5W1_uPSyvjqszw';
const CONTACT_EMAIL = 'e.freiwald@recyclingfox.com'; // ← hier deine E-Mail-Adresse eintragen

let allArticles = [];
let cart = {}; // {id: {article, qty}}

function norm(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }

async function loadArticles(){
  try{
    const res = await fetch(`${SB_URL}/rest/v1/kv_store?key=eq.articles&select=value`,{
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const rows = await res.json();
    if(!rows.length) throw new Error('Keine Daten');
    const articles = rows[0].value;
    // Only show articles with available qty > 0
    allArticles = articles.filter(a => verfuegbar(a) > 0);
    allArticles.sort((a,b)=>a.id.localeCompare(b.id));
    buildMarkeFilter();
    filterArticles();
  }catch(e){
    document.getElementById('errorBanner').style.display='block';
    document.getElementById('errorBanner').textContent='Fehler beim Laden: '+e.message;
    document.getElementById('articleList').innerHTML='<div class="empty">Artikel konnten nicht geladen werden.</div>';
  }
}

function verfuegbar(a){ return Math.max(0,(a.qty||0)-(a.reserved||0)); }

function buildMarkeFilter(){
  const marken = [...new Set(allArticles.map(a=>a.marke).filter(Boolean))].sort();
  const sel = document.getElementById('filterMarke');
  marken.forEach(m=>{
    const o = document.createElement('option');
    o.value=m; o.textContent=m;
    sel.appendChild(o);
  });
}

function filterArticles(){
  const q = norm(document.getElementById('searchInput').value);
  const art = document.getElementById('filterArt').value;
  const marke = document.getElementById('filterMarke').value;
  let results = allArticles.filter(a=>{
    if(art && a.art!==art) return false;
    if(marke && a.marke!==marke) return false;
    if(!q) return true;
    return norm(a.id).includes(q)||norm(a.marke).includes(q)||norm(a.bez1).includes(q)||norm(a.bez2).includes(q);
  });
  document.getElementById('resultCount').textContent = results.length+' Artikel verfügbar';
  if(!results.length){
    document.getElementById('articleList').innerHTML='<div class="empty">Keine Artikel gefunden.</div>';
    return;
  }
  document.getElementById('articleList').innerHTML = results.map(a=>`
    <div class="article-row ${(a.art||'').toLowerCase()}">
      <div class="tag-stripe"></div>
      <div class="article-row-body">
        <div>
          <div class="article-id">${esc(a.id)}</div>
          <div class="article-sub">${esc(a.marke||'–')}${a.bez1?' · <i>'+esc(a.bez1)+'</i>':''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="article-qty">${verfuegbar(a)} Stk.</div>
          <button class="add-btn" onclick="addToCart('${esc(a.id)}')">+ Warenkorb</button>
        </div>
      </div>
    </div>`).join('');
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function addToCart(id){
  const a = allArticles.find(x=>x.id===id);
  if(!a) return;
  if(cart[id]){
    const newQty = cart[id].qty + 1;
    if(newQty > verfuegbar(a)){ showToast('Maximale verfügbare Menge erreicht'); return; }
    cart[id].qty = newQty;
  } else {
    cart[id] = {article:a, qty:1};
  }
  updateCartBadge();
  showToast('✓ '+id+' zum Warenkorb hinzugefügt');
}

function updateCartBadge(){
  const count = Object.values(cart).reduce((s,c)=>s+c.qty,0);
  document.getElementById('cartBadge').textContent = count;
}

function openCart(){
  renderCart();
  document.getElementById('cartModal').style.display='flex';
}
function closeCart(){ document.getElementById('cartModal').style.display='none'; }
function closeCartOnBackdrop(e){ if(e.target.id==='cartModal') closeCart(); }

function renderCart(){
  const items = Object.values(cart);
  const content = document.getElementById('cartContent');
  const form = document.getElementById('cartForm');
  if(!items.length){
    content.innerHTML='<div class="cart-empty">Warenkorb ist leer.<br>Füge Artikel über den "+ Warenkorb"-Button hinzu.</div>';
    form.style.display='none';
    return;
  }
  content.innerHTML = items.map(({article:a, qty})=>`
    <div class="cart-item">
      <div class="cart-item-info">
        <div class="cart-item-id">${esc(a.id)}</div>
        <div class="cart-item-sub">${esc(a.marke||'–')}${a.bez1?' · '+esc(a.bez1):''} · verfügbar: ${verfuegbar(a)} Stk.</div>
      </div>
      <div class="qty-control">
        <button onclick="changeQty('${esc(a.id)}',-1)">−</button>
        <span>${qty}</span>
        <button onclick="changeQty('${esc(a.id)}',+1)">+</button>
      </div>
      <button class="remove-btn" onclick="removeFromCart('${esc(a.id)}')">🗑</button>
    </div>`).join('');
  form.style.display='block';
}

function changeQty(id, delta){
  if(!cart[id]) return;
  const newQty = cart[id].qty + delta;
  if(newQty <= 0){ removeFromCart(id); return; }
  if(newQty > verfuegbar(cart[id].article)){ showToast('Maximale verfügbare Menge erreicht'); return; }
  cart[id].qty = newQty;
  updateCartBadge();
  renderCart();
}

function removeFromCart(id){
  delete cart[id];
  updateCartBadge();
  renderCart();
}

function sendOrder(){
  const name = document.getElementById('orderName').value.trim();
  const email = document.getElementById('orderEmail').value.trim();
  const note = document.getElementById('orderNote').value.trim();
  if(!name||!email){ showToast('Bitte Name und E-Mail ausfüllen'); return; }
  const items = Object.values(cart);
  if(!items.length){ showToast('Warenkorb ist leer'); return; }

  const lines = items.map(({article:a,qty})=>`${a.id} – ${qty} Stk. (verfügbar: ${verfuegbar(a)} Stk.)`);
  const body = [
    `Bestellanfrage von: ${name}`,
    `E-Mail: ${email}`,
    '',
    'Gewünschte Artikel:',
    ...lines,
    ...(note?['','Anmerkung:',note]:[]),
    '',
    `Datum: ${new Date().toLocaleDateString('de-AT')}`,
  ].join('\n');

  const subject = encodeURIComponent(`Bestellanfrage Leergut – ${name}`);
  const bodyEncoded = encodeURIComponent(body);
  window.location.href = `mailto:${CONTACT_EMAIL}?subject=${subject}&body=${bodyEncoded}`;
}

function showToast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

loadArticles();
</script>
</body>
</html>
